version: 1.3.4

endpoints:
  anthropic:
    # Abilita prompt caching automatico
    promptCaching: true
    # Tutti i tuoi modelli disponibili, inclusi Fable 5, Sonnet 4.6 e i nuovi Opus
    availableModels:
      - claude-fable-5
      - claude-opus-4.8
      - claude-opus-4.7
      - claude-opus-4.6
      - claude-opus-4.5-20250514
      - claude-sonnet-4.6
      - claude-sonnet-4.5-20250929
      - claude-sonnet-4-20250514
      - claude-haiku-4.5-20251001
    # Configurazione avanzata della cache per ammortizzare i costi di Fable e del romanzo
    cacheOptions:
      enabled: true
      threshold: 1024
      ttl: 300

# Configurazione file uploads 
fileConfig:
  endpoints:
    anthropic:
      fileLimit: 20
      fileSizeLimit: 20971520
      supportedMimeTypes:
        - "image/png"
        - "image/jpeg"
        - "image/webp"
        - "image/gif"
        - "application/pdf"
        - "text/plain"
        - "text/csv"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

# Interfaccia utente
interface:
  showTokenCount: true
