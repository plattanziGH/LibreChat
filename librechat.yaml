version: 1.3.4

# Definiamo i parametri rigidi per Fable 5 (evita il blocco d'errore iniziale)
modelSpecs:
  - name: "Claude Fable 5"
    id: "claude-fable-5"
    provider: "anthropic"
    capabilities: ["artifacts"]
    preset:
      model: "claude-fable-5"
      thinking:
        type: "adaptive"      # Sblocca l'errore attivando la modalità nativa obbligatoria
      effort: "medium"        # Richiesto dai modelli di quinta generazione
      max_tokens: 4096

endpoints:
  anthropic:
    # Abilita prompt caching
    promptCaching: true
    # Modelli disponibili (Inclusa la flotta aggiornata Opus e Sonnet)
    availableModels:
      - claude-fable-5
      - claude-opus-4.8
      - claude-opus-4.7
      - claude-opus-4.6
      - claude-opus-4.5-20250514
      - claude-sonnet-4.6
      - claude-sonnet-4.5-20250929
      - claude-sonnet-4-20250514
      - claude-haiku-4.5-20251001
    # Configurazione cache
    cacheOptions:
      # Attiva cache automatica per conversazioni > 1024 token
      enabled: true
      # Soglia minima per attivare la cache (in token)
      threshold: 1024
      # TTL della cache in secondi (5 minuti default)
      ttl: 300

# Configurazione file uploads
fileConfig:
  endpoints:
    anthropic:
      # Abilita upload di file
      fileLimit: 20
      # Dimensione massima file (20MB)
      fileSizeLimit: 20971520
      # Tipi supportati
      supportedMimeTypes:
        - "image/png"
        - "image/jpeg"
        - "image/webp"
        - "image/gif"
        - "application/pdf"
        - "text/plain"
        - "text/csv"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

# Interfaccia utente
interface:
  # Mostra token count
  showTokenCount: true
