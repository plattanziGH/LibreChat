version: 1.3.3

endpoints:
  anthropic:
    # Abilita prompt caching
    promptCaching: true
    # Modelli disponibili
    availableModels:
      - claude-opus-4.5-20250514
      - claude-sonnet-4.5-20250929
      - claude-sonnet-4-20250514
      - claude-haiku-4.5-20251001
    # Configurazione cache
    cacheOptions:
      # Attiva cache automatica per conversazioni > 1024 token
      enabled: true
      # Soglia minima per attivare la cache (in token)
      threshold: 1024
      # TTL della cache in secondi (5 minuti default)
      ttl: 300

# Configurazione file uploads (opzionale ma utile)
fileConfig:
  endpoints:
    anthropic:
      # Abilita upload di file
      fileLimit: 20
      # Dimensione massima file (20MB)
      fileSizeLimit: 20971520
      # Tipi supportati
      supportedMimeTypes:
        - "image/png"
        - "image/jpeg"
        - "image/webp"
        - "image/gif"
        - "application/pdf"
        - "text/plain"
        - "text/csv"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

# Interfaccia utente
interface:
  # Mostra token count
  showTokenCount: true
